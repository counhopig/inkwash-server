<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inkpaper Console</title>
  <style>
    :root{color-scheme:light;--ink:#151612;--muted:#666860;--paper:#efeee8;--card:#fffffb;--line:#1e1f1a;--soft:#e5e4dd;--red:#151612}
    *{box-sizing:border-box}body{margin:0;background-color:var(--paper);background-image:radial-gradient(#15161218 .65px,transparent .65px);background-size:5px 5px;color:var(--ink);font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}button,input,select{font:inherit}
    main{max-width:1180px;margin:auto;padding:44px 24px 80px}.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px;padding-bottom:22px;border-bottom:2px solid var(--line)}.eyebrow{margin:0 0 9px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{font:800 42px/1 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;letter-spacing:-.06em}h2{font:800 20px/1.15 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0}p{color:var(--muted);margin:9px 0 0}.status{padding:8px 12px;border:1px solid var(--line);border-radius:0;background:var(--card);white-space:nowrap}.status.ok{color:var(--ink);border:2px double var(--line);background:var(--card)}
    .layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;align-items:start}.sidebar{position:sticky;top:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:0;padding:20px;box-shadow:4px 4px 0 var(--soft);margin-bottom:16px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:17px}.meta{font-size:12px;color:var(--muted)}
    .content-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:10px}.grow{flex:1;min-width:150px}
    input,select,button{border:1px solid var(--line);border-radius:0;padding:10px 12px;background:var(--card);color:var(--ink);min-height:42px}input,select{width:100%}input:focus,select:focus{outline:3px double var(--line);outline-offset:2px}button{cursor:pointer;font-weight:800;white-space:nowrap}button:hover{background:var(--soft);box-shadow:2px 2px 0 var(--line)}button:active{box-shadow:none;transform:translate(1px,1px)}button.primary{background:var(--card);color:var(--ink);border:2px solid var(--line)}button.primary:hover{background:var(--soft)}button.danger{color:var(--red);background:repeating-linear-gradient(135deg,transparent,transparent 5px,#15161208 5px,#15161208 6px)}button.quiet{background:transparent}
    label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:5px}.list{margin-top:16px;border-top:1px solid var(--line)}.item{display:flex;align-items:center;gap:12px;padding:13px 1px;border-bottom:1px dashed var(--line)}.item .text{flex:1;min-width:0}.item b{font-size:17px}.empty{color:var(--muted);padding:24px 2px}.count{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:0;background:var(--card);color:var(--ink);font-size:12px;font-weight:800}
    .token{display:none;margin-top:14px;padding:14px;background:var(--soft);border:1px dashed var(--line);border-radius:0;word-break:break-all}.token.show{display:block}.device-context{padding:13px 14px;border-radius:0;background:var(--card);border:1px solid var(--line);margin-bottom:16px;color:var(--muted)}
    #message{position:fixed;right:24px;bottom:24px;max-width:440px;padding:13px 17px;border-radius:0;border:2px solid var(--line);background:var(--card);color:var(--ink);box-shadow:4px 4px 0 #15161233;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}#message.show{opacity:1;transform:none}code{font-family:ui-monospace,SFMono-Regular,monospace}
    @media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static}.content-grid{grid-template-columns:1fr}}@media(max-width:620px){main{padding:28px 14px 60px}.masthead{align-items:flex-start;flex-direction:column}h1{font-size:36px}.card{padding:17px}.row>*{flex:1 1 140px}}
  </style>
</head>
<body><main>
  <header class="masthead"><div><div class="eyebrow">Device cloud</div><h1>Inkpaper Console</h1><p>Manage device content and prepare the next sync.</p></div><span id="status" class="status">○ Not connected</span></header>
  <div class="layout"><aside class="sidebar">
    <section class="card"><div class="card-head"><h2>Server access</h2></div><div class="stack"><input id="adminToken" type="password" placeholder="Admin token"><button class="primary" onclick="connect()">Connect to server</button></div></section>
    <section class="card"><div class="card-head"><h2>Device</h2><span id="deviceCount" class="count">0</span></div>
      <div class="stack"><select id="device" onchange="loadContent()"><option value="">Connect first</option></select><div class="row"><button class="quiet" onclick="loadDevices()">Refresh</button><button class="danger" onclick="deleteDevice()">Delete device</button></div></div>
      <div style="height:1px;background:var(--line);margin:19px 0"></div><label>Register another device<div class="row"><input id="deviceName" class="grow" placeholder="Device name"><button class="primary" onclick="registerDevice()">Register</button></div></label>
      <div id="newToken" class="token"></div>
    </section>
  </aside><section>
    <div id="deviceContext" class="device-context">Select a device to manage the content it receives on the next sync.</div>
    <div class="content-grid">
    <section class="card"><div class="card-head"><h2>Alarms</h2><span id="alarmCount" class="count">0</span></div>
      <div class="row"><label>Hour<input id="hour" type="number" min="0" max="23" value="7" style="width:85px"></label><label>Minute<input id="minute" type="number" min="0" max="59" value="0" style="width:85px"></label><label class="grow">Label<input id="alarmLabel" placeholder="Wake up"></label><button class="primary" onclick="addAlarm()">Add</button></div>
      <div id="alarms" class="list"><div class="empty">No device selected</div></div><button class="danger" style="margin-top:14px" onclick="clearKind('alarms')">Clear alarms</button>
    </section>
    <section class="card"><div class="card-head"><h2>Todos</h2><span id="todoCount" class="count">0</span></div>
      <div class="row"><input id="todoText" class="grow" placeholder="Test todo"><button class="primary" onclick="addTodo()">Add</button></div>
      <div id="todos" class="list"><div class="empty">No device selected</div></div><button class="danger" style="margin-top:14px" onclick="clearKind('todos')">Clear todos</button>
    </section>
  </div></section></div>
</main><div id="message"></div>
<script>
const $=id=>document.getElementById(id); let token=localStorage.getItem('inkpaperAdminToken')||''; $('adminToken').value=token;
function toast(text){const el=$('message');el.textContent=text;el.classList.add('show');clearTimeout(el.t);el.t=setTimeout(()=>el.classList.remove('show'),3000)}
async function api(path,options={}){const res=await fetch(path,{...options,headers:{Authorization:`Bearer ${token}`,...(options.body?{'Content-Type':'application/json'}:{}),...options.headers}});if(!res.ok)throw new Error(`${res.status} ${await res.text()}`);if(res.status===204)return null;return res.json()}
async function connect(){token=$('adminToken').value.trim();localStorage.setItem('inkpaperAdminToken',token);await loadDevices()}
async function loadDevices(){try{const previous=deviceId(),list=await api('/api/devices');$('device').innerHTML=list.length?list.map(d=>`<option value="${d.id}">#${d.id} · ${esc(d.name)}</option>`).join(''):'<option value="">No devices registered</option>';$('deviceCount').textContent=list.length;if(previous&&list.some(d=>String(d.id)===previous))$('device').value=previous;$('status').textContent='● Server connected';$('status').classList.add('ok');await loadContent()}catch(e){$('status').textContent='○ Connection failed';$('status').classList.remove('ok');toast(e.message)}}
async function registerDevice(){const name=$('deviceName').value.trim();if(!name)return toast('Enter a device name');try{const d=await api('/api/devices',{method:'POST',body:JSON.stringify({name})});$('newToken').className='token show';$('newToken').innerHTML=`Device token (shown once): <code>${esc(d.token)}</code> <button onclick="navigator.clipboard.writeText('${d.token}');toast('Copied')">Copy</button>`;$('deviceName').value='';await loadDevices();$('device').value=String(d.id);await loadContent()}catch(e){toast(e.message)}}
function deviceId(){return $('device').value} async function loadContent(){const id=deviceId();if(!id){$('deviceContext').textContent='Select a device to manage the content it receives on the next sync.';$('alarmCount').textContent='0';$('todoCount').textContent='0';return}const selected=$('device').selectedOptions[0]?.textContent||`Device #${id}`;$('deviceContext').innerHTML=`Editing <strong>${esc(selected)}</strong> · changes become available to the device on its next sync.`;try{const [a,t]=await Promise.all([api(`/api/devices/${id}/alarms`),api(`/api/devices/${id}/todos`)]);$('alarmCount').textContent=a.length;$('todoCount').textContent=t.length;$('alarms').innerHTML=a.length?a.map(x=>`<div class="item"><span class="text"><b>${pad(x.hour)}:${pad(x.minute)}</b><br><span class="meta">${esc(x.label||'No label')} · ${x.enabled?'Enabled':'Disabled'}</span></span><button class="danger" onclick="remove('alarms',${x.id})">Delete</button></div>`).join(''):'<div class="empty">No alarms scheduled</div>';$('todos').innerHTML=t.length?t.map(x=>`<div class="item"><span class="text">${x.done?'✓ ':''}${esc(x.text)}${x.done?'<br><span class="meta">Completed</span>':''}</span><button class="danger" onclick="remove('todos',${x.id})">Delete</button></div>`).join(''):'<div class="empty">No todos waiting</div>'}catch(e){toast(e.message)}}
async function addAlarm(){const id=deviceId();if(!id)return toast('Select a device');const body={hour:+$('hour').value,minute:+$('minute').value,repeat:'Daily',enabled:true,label:$('alarmLabel').value.trim()};try{await api(`/api/devices/${id}/alarms`,{method:'POST',body:JSON.stringify(body)});$('alarmLabel').value='';await loadContent();toast('Alarm added')}catch(e){toast(e.message)}}
async function addTodo(){const id=deviceId(),text=$('todoText').value.trim();if(!id||!text)return toast('Select a device and enter text');try{await api(`/api/devices/${id}/todos`,{method:'POST',body:JSON.stringify({text,done:false})});$('todoText').value='';await loadContent();toast('Todo added')}catch(e){toast(e.message)}}
async function remove(kind,id){try{await api(`/api/devices/${deviceId()}/${kind}/${id}`,{method:'DELETE'});await loadContent()}catch(e){toast(e.message)}}
async function clearKind(kind){if(!deviceId()||!confirm(`Clear all ${kind}?`))return;try{await api(`/api/devices/${deviceId()}/${kind}`,{method:'DELETE'});await loadContent();toast(`All ${kind} cleared`)}catch(e){toast(e.message)}}
async function deleteDevice(){const id=deviceId();if(!id||!confirm('Delete this device and all content?'))return;try{await api(`/api/devices/${id}`,{method:'DELETE'});$('newToken').className='token';await loadDevices()}catch(e){toast(e.message)}}
function pad(n){return String(n).padStart(2,'0')} function esc(v){const d=document.createElement('div');d.textContent=v??'';return d.innerHTML}
if(token)connect();
</script></body></html>
