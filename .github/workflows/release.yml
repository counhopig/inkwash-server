name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds run on Apple Silicon only: GitHub retired its
          # Intel macOS runners (macos-13), so an x86_64 macOS job would
          # sit queued forever. Intel-Mac users build from source.
          - os: ubuntu-latest
            artifact: inkwash-server-linux-x86_64
          - os: macos-14
            artifact: inkwash-server-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Node (for the embedded admin-ui build)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json

      - name: Install admin-ui tooling
        run: npm install --prefix admin-ui

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/inkwash-server "dist/${{ matrix.artifact }}"
          tar -C dist -czf "dist/${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: false
          fail_on_unmatched_files: false
